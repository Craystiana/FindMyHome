<ion-header>
  <ion-toolbar color="primary">
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size-lg="2" size-sm="0">
          <ion-title style="height: 100%;">Anunturi</ion-title>
        </ion-col>
        
        <ion-col offset-lg="2" size-lg="3" size-sm="1">
          <ion-searchbar mode="ios"
                         debounce="500"
                         animated
                         color="dark"
                         placeholder="Cauta anunturi"
                         style="padding: inherit;"
                         [(ngModel)]="searchTerm"
                         (ionChange)="getListings()"></ion-searchbar>
        </ion-col>
      </ion-row>
    </ion-grid>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-button slot="end" color="dark" shape="round" title="Add Listing" (click)="addPage()">
      <ion-icon name="add-circle-outline"></ion-icon>
    </ion-button>


  </ion-toolbar>
</ion-header>

<ion-content *ngIf="listings !== undefined">
  <ion-toolbar>
    <ion-segment [scrollable]="true" value="all">
      <ion-segment-button value="listingType" id="listing-type">
        <ion-label>Tip</ion-label>
      </ion-segment-button>
      <ion-segment-button value="listingMarketingType" id="listing-marketing-type">
        <ion-label>Oferta</ion-label>
      </ion-segment-button>
      <ion-segment-button value="county" id="county">
        <ion-label>Judet</ion-label>
      </ion-segment-button>
      <ion-segment-button value="city" id="city">
        <ion-label>Oras</ion-label>
      </ion-segment-button>
      <ion-segment-button value="sort" id="sort">
        <ion-label>Sortare</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>

  <ion-grid>
    <ion-row style="justify-content: center">
      <ion-col size-lg="3" 
               *ngFor="let listing of listings">
        <ion-card [routerLink]="['/listing/detail']" [queryParams]="{listingId : listing.listingId}">
          <swiper-container *ngIf="listing.pictures" style="height: 250px;">
            <swiper-slide *ngFor="let picture of listing.pictures">
              <img [src]="'data:image/jpg;base64,' + picture"
               style="width: 100%; max-height: 500px;"/>
            </swiper-slide>
          </swiper-container>
          <ion-card-header class="ion-text-center">
            <ion-card-subtitle>{{listing.listingType}}</ion-card-subtitle>
            <ion-card-title>{{listing.title}}</ion-card-title>
          </ion-card-header>
      
          <ion-card-content>
            <ion-item lines="none" color="transparent">
              <ion-icon name="home-outline" slot="start" color="primary"></ion-icon>
              <ion-label>{{listing.description}}</ion-label>
            </ion-item>
      
            <ion-item lines="none" color="transparent">
              <ion-icon name="cash-outline" slot="start" color="success"></ion-icon> 
              <ion-label>{{listing.price}} €</ion-label>
              <ion-icon *ngIf="listing.isFavorite" name="star" slot="end" color="warning"></ion-icon>
            </ion-item>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-modal trigger="listing-type" #typemodal>
  <ng-template>
    <app-select-modal
      class="ion-page"
      title="Tip anunt"
      [items]="listingData.listingTypes"
      [selectedItems]="listingType"
      (selectionChange)="typeSelectionChanged($event)"
      (selectionCancel)="typemodal.dismiss()"
    ></app-select-modal>
  </ng-template>
</ion-modal>

<ion-modal trigger="listing-marketing-type" #marketingmodal>
  <ng-template>
    <app-select-modal
      class="ion-page"
      title="Tip oferta"
      [items]="listingData.listingMarketingTypes"
      [selectedItems]="listingMarketingType"
      (selectionChange)="marketingTypeSelectionChanged($event)"
      (selectionCancel)="marketingmodal.dismiss()"
    ></app-select-modal>
  </ng-template>
</ion-modal>

<ion-modal trigger="county" #countymodal>
  <ng-template>
    <app-select-modal
      class="ion-page"
      title="Judet"
      [items]="listingData.counties"
      [selectedItems]="listingCounty"
      (selectionChange)="countiesSelectionChanged($event)"
      (selectionCancel)="countymodal.dismiss()"
    ></app-select-modal>
  </ng-template>
</ion-modal>

<ion-modal trigger="city" #citymodal>
  <ng-template>
    <app-select-modal
      class="ion-page"
      title="Oras"
      [items]="listingData.cities"
      [selectedItems]="listingCity"
      (selectionChange)="citiesSelectionChanged($event)"
      (selectionCancel)="citymodal.dismiss()"
    ></app-select-modal>
  </ng-template>
</ion-modal>

<ion-modal trigger="sort" #sortmodal>
  <ng-template>
    <app-select-modal
      class="ion-page"
      title="Sortare"
      [items]="sorting"
      [selectedItems]="sortBy"
      (selectionChange)="sortSelectionChanged($event)"
      (selectionCancel)="sortmodal.dismiss()"
    ></app-select-modal>
  </ng-template>
</ion-modal>
